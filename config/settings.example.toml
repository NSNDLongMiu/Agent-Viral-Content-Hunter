database_path = "backend/data/hunter.sqlite3"

[budget]
allow_paid_api = false

[queue]
lease_seconds = 60
retry_base_seconds = 5
# Số phút chờ sau khi hết quota trước khi cho một tác vụ của nhóm worker chạy thử.
quota_cooldown_minutes = 30
claude = 1
codex = 2
gemini = 2
collector = 2
# local is derived from the available CPU count when omitted.

[retention]
days = 90

[runtime]
enabled = false
scheduler_tick_seconds = 30
telegram_poll_seconds = 1
dashboard_dir = "dashboard/dist"
dashboard_url = "http://127.0.0.1:8000"
# Ngưỡng điểm chung để tạo brief, với hạn mức nhỏ để vẫn chọn được tin có tín hiệu mạnh ngoài nhóm trọng tâm.
draft_min_virality = 60.0
draft_min_relevance = 45.0
max_drafts_per_scan = 4
# Tin RSS về phim ngắn, micro-drama, giải trí và sản xuất bằng AI thường thiếu số liệu lan truyền.
# Ngưỡng điểm phù hợp và hạn mức riêng tạo thêm chỗ cho các bài đúng trọng tâm.
draft_min_focus_relevance = 50.0
max_focus_drafts_per_scan = 10

[auth]
# The dashboard has no login. Only the Claude leader's review token is configured: set claude_service_token in
# settings.local.toml or in HUNTER_AUTH__CLAUDE_SERVICE_TOKEN.

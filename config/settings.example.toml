database_path = "backend/data/hunter.sqlite3"

[budget]
allow_paid_api = false

[queue]
lease_seconds = 60
retry_base_seconds = 5
claude = 1
codex = 2
gemini = 2
collector = 2
# local is derived from the available CPU count when omitted.

[retention]
days = 90

[runtime]
enabled = false
scheduler_tick_seconds = 30
telegram_poll_seconds = 1
dashboard_dir = "dashboard/dist"
dashboard_url = "http://127.0.0.1:8000"
# Draft gate: do not spend AI on weak items (tiết kiệm quota, ưu tiên chất lượng)
draft_min_virality = 60.0
draft_min_relevance = 45.0
max_drafts_per_scan = 8

[auth]
session_ttl_seconds = 28800
# Set admin_password_hash and claude_service_token in settings.local.toml or in
# HUNTER_AUTH__ADMIN_PASSWORD_HASH and HUNTER_AUTH__CLAUDE_SERVICE_TOKEN.
